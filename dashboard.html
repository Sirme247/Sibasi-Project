<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #605DFF;
            --dark-bg: #191919;
            --nav-height: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        .background {
            display: block;
            width: 100vw;
            height: 100vh;
            opacity: 1;
            z-index: 1;
            background-size: cover;
            background-repeat: no-repeat;
        }

        .menu__wrapper {
            display: flex;
            position: relative;
            flex-direction: row;
            z-index: 2;
        }

        .menu__bar {
            position: fixed;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
            padding: 0 1rem;
            gap: 2rem;
            background: var(--dark-bg);
            height: 4rem;
            opacity: 0.9;
        }

        .menu-icon {
            cursor: pointer;
            display: flex;
            height: 2rem;
            width: 2rem;
        }

        .navigation {
            display: flex;
            flex-direction: row;
            list-style-type: none;
            align-items: center;
            gap: 1.5rem;
            padding: 0;
            background-color: var(--dark-bg);
        }

        .logo svg {
            width: 2rem;
            height: 2rem;
        }

        .navigation>li {
            display: flex;
            position: relative;
            cursor: pointer;
            font-size: 1.25rem;
        }

        .navigation>li>a {
            color: white;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
            text-decoration: none;
            font-weight: 500;
            background-image: linear-gradient(to right,
                    var(--primary),
                    var(--primary) 50%,
                    white 50%);
            background-size: 200% 100%;
            background-position: -100%;
            display: inline-block;
            padding: 0.2rem 0;
            position: relative;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.2s ease-in-out;
        }

        .navigation>li>a:before {
            content: '';
            background: var(--primary);
            display: block;
            position: absolute;
            bottom: -0.125rem;
            left: 0;
            width: 0;
            height: 0.125rem;
            transition: all 0.2s ease-in-out;
        }

        .navigation>li>a:hover {
            background-position: 0;
        }

        .navigation>li>a:hover::before {
            width: 100%;
        }

        @media (min-width: 600px) {
            .menu-icon {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .navigation {
                display: none;
            }

            .menu-icon {
                display: block;
            }

            .navigation--mobile {
                top: var(--nav-height);
                position: absolute;
                right: 0;
                display: flex;
                padding: 5rem 3.5rem;
                min-height: 100%;
                background-color: var(--dark-bg);
                gap: 0.5rem;
                flex-direction: column;
                align-items: center;
                opacity: 0.95;
                animation: fadein 0.3s forwards;
            }

            .menu__bar {
                justify-content: end;
            }

            @keyframes fadein {
                0% {
                    opacity: 0;
                    width: 0;
                    height: 0;
                }

                100% {
                    opacity: 1;
                    width: 100%;
                    height: calc(100vh - var(--nav-height));
                }
            }

            .navigation--mobile--fadeout {
                animation: fadeout 300ms forwards;
            }

            @keyframes fadeout {
                0% {
                    opacity: 1;
                    width: 100%;
                    height: calc(100vh - var(--nav-height));
                }

                100% {
                    opacity: 0;
                    width: 0;
                    height: 0;
                }
            }
        }
    </style>
</head>

<body>
    <div class="background">
        <div class="menu__wrapper">
            <div class="menu__bar">
                <svg class="menu-icon" onclick="toggleMenu(this)" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
                <ul class="navigation">
                    <li>
                        <a href="homepage.html" title="Services">Homepage</a>
                    </li>
                    <li>
                        <a href="cardspage.html" title="Blog">Cards Page</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <script>
        const toggleMenu = (icon) => {
            const navigation = document.querySelector(".navigation");
            if (!navigation || !icon) return;

            const isBurger = icon.querySelector('line');
            
            if (isBurger) {
                if (navigation.classList.contains('navigation--mobile')) {
                    icon.innerHTML = '<line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line>';
                    navigation.classList.add("navigation--mobile--fadeout");
                    setTimeout(() => {
                        navigation.classList.remove("navigation--mobile");
                        navigation.classList.remove("navigation--mobile--fadeout");
                    }, 300);
                } else {
                    icon.innerHTML = '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>';
                    navigation.classList.add("navigation--mobile");
                }
            }
        };
    </script>
</body>

</html>
