<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
  
    <style>
        :root {
            --primary: #605DFF;
            --primary-hover: #4a00e0;
            --gray-bg: #E9E9E9;
            --gray-hover: #dddddd;
            --text: #1F2346;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-size: 16px;
            font-family: 'Work Sans', sans-serif;
            height: 100vh;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        } 

        .socials-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .socials-row img {
            width: 1.5rem;
            height: 1.5rem;
        }

        .socials-row>a {
            padding: 0.5rem;
            border-radius: 10rem;
            width: 100%;
            min-height: 3rem;
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 1.1rem;
            color: var(--text);
            background-color: var(--gray-bg);
            font-weight: 700;
        }

        .socials-row>a:hover {
            background-color: var(--gray-hover);
        }

        .login-welcome-row {
            margin-bottom: 1rem;
            text-align: center;
        }

        .my-form {
            display: flex;
            flex-direction: column;
            justify-content: start;
            position: relative;
            gap: 1rem;
            background-color: var(--white);
            width: 100%;
            max-width: 32rem;
            padding: 3rem 2rem;
            border-radius: 2rem;
            height: fit-content;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .my-form__button {
            background-color: var(--primary);
            color: white;
            white-space: nowrap;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 1rem;
            line-height: 3.125rem;
            outline: none;
            font-size: 1.125rem;
            letter-spacing: .025rem;
            text-decoration: none;
            cursor: pointer;
            font-weight: 800;
            min-height: 3.125rem;
            width: 100%;
            border-radius: 10rem;
            transition: all .3s ease;
        }

        .my-form__button:hover {
            background-color: var(--primary-hover);
        }

        .input__wrapper {
            position: relative;
            padding: 0.9375rem 0 0;
            margin-bottom: 0.5rem;
        }

        .input__field {
            font-size: 1.5rem;
            color: var(--text);
            padding: 0.375rem 0;
            padding-right: 2rem;
            line-height: 2rem;
            height: 2rem;
            outline: 0;
            border: 0;
            width: 100%;
            vertical-align: middle;
            padding-bottom: 0.7rem;
            border-bottom: 3px solid var(--text);
            background: transparent;
            transition: border-color 0.2s;
        }

        .input__field::placeholder {
            color: transparent;
        }

        .input__label {
            user-select: none;
        }

        .input__field:placeholder-shown~.input__label {
            cursor: text;
            color: var(--text);
            top: 0.8rem;
            font-size: 1.2rem;
        }

        .input__label,
        .input__field:focus~.input__label {
            position: absolute;
            top: -0.8rem;
            display: block;
            font-size: 1.2rem;
            color: var(--text);
            transition: 0.3s;
        }

        .input__field:focus~.input__label {
            color: var(--primary);
        }

        .input__field:focus {
            border-bottom: 3px solid var(--primary);
        }

        .input__field:focus~svg {
            stroke: var(--primary);
        }

        .input__icon {
            position: absolute;
            right: -0.875rem;
            bottom: -0.6875rem;
            width: 2.25rem;
            height: 2.25rem;
            padding: 0.125rem;
            transform: translate(-50%, -50%);
            transform-origin: center;
            cursor: pointer;
        }

        .input__icon:hover {
            border-radius: 50%;
        }

        .my-form__actions {
            display: flex;
            flex-direction: column;
            align-self: center;
            color: var(--text);
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .my-form__actions a {
            color: var(--text);
            font-weight: 600;
            text-decoration: none;
        }

        .my-form__actions a:hover {
            text-decoration: underline;
        }

        .my-form__row {
            display: flex;
            gap: 0.5rem;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <form class="my-form">
        <div class="login-welcome-row">
            <h1>Welcome back</h1>
            <p>Please enter your details!</p>
        </div>
        <div class="input__wrapper">
            <input type="email" id="email" name="email" class="input__field" placeholder="Your Email" required>
            <label for="email" class="input__label">Email:</label>
        </div>
        <div class="input__wrapper">
            <input id="password" type="password" class="input__field" placeholder="Your Password"
                title="Minimum 8 characters with at least 1 letter and 1 number"
                pattern="^(?=.*[A-Za-z]).{8,}$" required>
            <label for="password" class="input__label">Password</label>
        </div>
        <button type="submit" class="my-form__button">Login</button>
    </form>

    <script>
        const loginForm = document.querySelector(".my-form");
        if (loginForm) {
            const emailInput = document.getElementById("email");
            const passwordInput = document.getElementById("password");
            const loginButton = document.querySelector(".my-form__button");

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const passwordPattern = /^(?=.*[A-Za-z]).{8,}$/;

            loginButton.disabled = true;
            loginButton.style.opacity = "0.6";
            loginButton.style.cursor = "not-allowed";

            function validateInput() {
                const emailValid = emailPattern.test(emailInput.value.trim());
                const passwordValid = passwordPattern.test(passwordInput.value.trim());

                if (emailValid && passwordValid) {
                    loginButton.disabled = false;
                    loginButton.style.opacity = "1";
                    loginButton.style.cursor = "pointer";
                } else {
                    loginButton.disabled = true;
                    loginButton.style.opacity = "0.6";
                    loginButton.style.cursor = "not-allowed";
                }
            }

            emailInput.addEventListener("input", validateInput);
            passwordInput.addEventListener("input", validateInput);

            loginForm.addEventListener("submit", (e) => {
                e.preventDefault();
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();

                if (!emailPattern.test(email)) {
                    alert("Please enter a valid email address.");
                    return;
                }

                if (!passwordPattern.test(password)) {
                    alert("Password must be at least 8 characters long and contain at least one letter and one number.");
                    return;
                }

                console.log("Email:", email);
                console.log("Password:", password);
                window.location.href = "dashboard.html";
            });
        }
    </script>
</body>

</html>
